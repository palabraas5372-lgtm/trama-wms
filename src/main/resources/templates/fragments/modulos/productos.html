<section th:fragment="productos" id="pag-productos" class="d-none" data-modulo="productos">

    <div class="card-surface">
        <div class="card-surface-head flex-wrap gap-2">
            <div>
                <h2 class="h6 mb-0">Listado de productos</h2>
                <div class="small text-muted-soft" id="conteoProductos"
                    th:text="${#lists.size(productosL)} + ' producto(s)'">0 producto(s)</div>
            </div>
            <div class="d-flex gap-2 align-items-center">
                <!-- Filtro: categorías cargadas desde la tabla "categorias" -->
                <select class="form-select form-select-sm" id="filtroCategoriaProducto" style="width:auto;"
                    aria-label="Filtrar por categoría">
                    <option value="">Todas las categorías</option>
                    <option th:each="c : ${categoriasL}" th:value="${c.idCategoria}" th:text="${c.nombre}">
                        Categoría</option>
                </select>
                <button type="button" class="btn btn-thread btn-sm text-nowrap" data-modal="modalProducto"
                    data-modo="nuevo">
                    <i class="bi bi-plus-lg me-1"></i>Nuevo producto
                </button>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(productosL)}" class="empty-state">
            <i class="bi bi-box-seam"></i>
            <div class="small mt-1">Aún no hay productos registrados.</div>
        </div>

        <div class="table-responsive" th:unless="${#lists.isEmpty(productosL)}">
            <table class="table table-trama mb-0">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Talla</th>
                        <th>Color</th>
                        <th>Stock</th>
                        <th>Mínimo</th>
                        <th>Precio</th>
                        <th>Ubicación</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${productosL}"
                        th:attr="data-categoria=${p.categoria != null ? p.categoria.idCategoria : ''}">
                        <td class="fw-semibold text-nowrap" th:text="${p.codigo}">TR-0000</td>
                        <td th:text="${p.nombre}">Producto</td>
                        <td class="text-muted-soft" th:text="${p.categoria != null ? p.categoria.nombre : '—'}">—</td>
                        <td th:text="${p.talla}">M</td>
                        <td>
                            <span class="swatch-wrap">
                                <span class="swatch" th:style="'background:' + ${p.colorHex}"></span>
                                <span th:text="${p.color}">Azul</span>
                            </span>
                        </td>
                        <td>
                            <span th:if="${p.stock == 0}" class="badge-status badge-out">Agotado</span>
                            <span th:if="${p.stock > 0 and p.stock <= p.stockMinimo}" class="badge-status badge-low"
                                th:text="${p.stock} + ' uds.'">0 uds.</span>
                            <span th:if="${p.stock > p.stockMinimo}" class="badge-status badge-ok"
                                th:text="${p.stock} + ' uds.'">0 uds.</span>
                        </td>
                        <td class="text-muted-soft" th:text="${p.stockMinimo}">0</td>
                        <td class="text-nowrap" th:text="'S/ ' + ${#numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</td>
                        <td class="text-muted-soft" th:text="${p.ubicacion}">A-01-01</td>
                        <td class="text-end text-nowrap">
                            <button type="button" class="btn btn-sm btn-outline-denim me-1" title="Editar"
                                data-modal="modalProducto" data-modo="editar"
                                th:attr="data-idproducto=${p.idProducto},
                                         data-codigo=${p.codigo},
                                         data-nombre=${p.nombre},
                                         data-categoria=${p.categoria != null ? p.categoria.idCategoria : ''},
                                         data-talla=${p.talla},
                                         data-color=${p.color},
                                         data-colorhex=${p.colorHex},
                                         data-stock=${p.stock},
                                         data-stockminimo=${p.stockMinimo},
                                         data-ubicacion=${p.ubicacion},
                                         data-precio=${p.precio}">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <a th:href="@{/productos/eliminar/{id}(id=${p.idProducto})}"
                                class="btn btn-sm btn-outline-secondary" title="Eliminar"
                                th:attr="data-confirm='¿Eliminar el producto ' + ${p.codigo} + '?'">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ══════════════ MODAL: PRODUCTO ══════════════ -->
    <div class="modal fade" id="modalProducto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form th:action="@{/productos/guardar}" method="post">
                    <div class="modal-header">
                        <div>
                            <span class="stitch-tag">Inventario</span>
                            <h5 class="modal-title fw-display mt-1" id="tituloProducto">Registrar nuevo producto</h5>
                        </div>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>

                    <div class="modal-body">
                        <input type="hidden" name="idProducto" value="">

                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label small fw-semibold" for="pCodigo">Código</label>
                                <!-- Se genera automáticamente (TR-####); no se puede escribir -->
                                <input type="text" class="form-control bg-light" id="pCodigo" name="codigo"
                                    th:value="${siguienteCodigo}" readonly tabindex="-1">
                                <div class="form-text">Se asigna automáticamente.</div>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label small fw-semibold" for="pNombre">Nombre del producto</label>
                                <input type="text" class="form-control" id="pNombre" name="nombre"
                                    placeholder="Ej. Chaleco Acolchado" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-semibold" for="pCategoria">Categoría</label>
                                <select class="form-select" id="pCategoria" name="categoria" required>
                                    <option value="">-- Seleccione --</option>
                                    <option th:each="c : ${categoriasL}" th:value="${c.idCategoria}"
                                        th:text="${c.nombre}">Categoría</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-semibold" for="pTalla">Talla</label>
                                <input type="text" class="form-control" id="pTalla" name="talla" placeholder="M">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-semibold" for="pUbicacion">Ubicación</label>
                                <input type="text" class="form-control" id="pUbicacion" name="ubicacion"
                                    placeholder="A-01-01">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-semibold" for="pColor">Color</label>
                                <input type="text" class="form-control" id="pColor" name="color"
                                    placeholder="Ej. Azul Marino">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold" for="pColorHex">Código de color</label>
                                <input type="color" class="form-control form-control-color w-100" id="pColorHex"
                                    name="colorHex" value="#2F4771">
                            </div>

                            <div class="col-md-3">
                                <label class="form-label small fw-semibold" for="pPrecio">Precio (S/)</label>
                                <input type="number" class="form-control" id="pPrecio" name="precio" min="0" step="0.01"
                                    value="0.00" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-semibold" for="pStock">Stock actual</label>
                                <input type="number" class="form-control" id="pStock" name="stock" min="0" value="0"
                                    required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-semibold" for="pStockMinimo">Stock mínimo</label>
                                <input type="number" class="form-control" id="pStockMinimo" name="stockMinimo" min="0"
                                    value="10" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-semibold">Estado</label>
                                <div class="pt-2">
                                    <span class="badge-status badge-transit" id="estadoProducto">—</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">
                            Cancelar
                        </button>
                        <button type="submit" class="btn btn-denim btn-sm">Guardar producto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        (function () {
            // Filtra el listado de productos por la categoría elegida
            var filtro = document.getElementById('filtroCategoriaProducto');
            if (!filtro) return;
            filtro.addEventListener('change', function () {
                var visibles = 0;
                document.querySelectorAll('#pag-productos tbody tr').forEach(function (fila) {
                    var mostrar = !filtro.value || fila.getAttribute('data-categoria') === filtro.value;
                    fila.classList.toggle('d-none', !mostrar);
                    if (mostrar) visibles++;
                });
                document.getElementById('conteoProductos').textContent = visibles + ' producto(s)';
            });
        })();
    </script>

</section>
