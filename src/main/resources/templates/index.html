<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" th:href="@{/assets/img/favicon.svg}">
    <title>TRAMA · Sistema de Gestión de Almacenes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/assets/css/styles.css}">
</head>

<body>

    <!-- ══════════════════════════════════════════════════════════════
         Aplicación (visible solo después de iniciar sesión). El contenido
         de cada módulo (Dashboard, Inventario, Movimientos, Sucursales,
         Solicitudes, Categorías, Proveedores, Usuarios, Roles) está
         embebido más abajo en #pageOutlet y se muestra u oculta con
         trama-app.js según el hash de la URL.
         ══════════════════════════════════════════════════════════════ -->
    <div id="viewApp" class="app-shell">

        <!-- Sidebar: offcanvas de Bootstrap, fijo en desktop y deslizable en móvil -->
        <div class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="sidebarOffcanvas"
            aria-labelledby="sidebarOffcanvasLabel">
            <div class="offcanvas-header d-lg-none">
                <div class="brand-mark" id="sidebarOffcanvasLabel">
                    <svg class="needle" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 20L15 9" stroke="#E8A33D" stroke-width="2" stroke-linecap="round" />
                        <circle cx="17.5" cy="6.5" r="3" stroke="#E8A33D" stroke-width="2" />
                        <path d="M2.5 21.5L4.5 19.5" stroke="#E8A33D" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    <span>TRAMA</span>
                </div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                    data-bs-target="#sidebarOffcanvas" aria-label="Cerrar"></button>
            </div>

            <div class="offcanvas-body">
                <div class="sidebar-head d-none d-lg-block">
                    <div class="brand-mark">
                        <svg class="needle" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 20L15 9" stroke="#E8A33D" stroke-width="2" stroke-linecap="round" />
                            <circle cx="17.5" cy="6.5" r="3" stroke="#E8A33D" stroke-width="2" />
                            <path d="M2.5 21.5L4.5 19.5" stroke="#E8A33D" stroke-width="2" stroke-linecap="round" />
                        </svg>
                        <span>TRAMA</span>
                    </div>
                    <div class="brand-sub mt-1">Almacén Central</div>
                </div>

                <nav class="sidebar-nav">
                    <span class="stitch-tag px-3 pt-2 pb-1 d-block" style="color:rgba(255,255,255,.55);">Operación</span>

                    <a href="#dashboard" class="nav-link" data-page="dashboard">
                        <i class="bi bi-grid-1x2-fill"></i>Dashboard
                    </a>
                    <a href="#productos" class="nav-link" data-page="productos">
                        <i class="bi bi-box-seam"></i>Inventario
                    </a>
                    <a href="#movimientos" class="nav-link" data-page="movimientos">
                        <i class="bi bi-arrow-left-right"></i>Entradas / Salidas
                    </a>
                    <a href="#sucursales" class="nav-link" data-page="sucursales">
                        <i class="bi bi-shop"></i>Sucursales
                    </a>
                    <a href="#solicitudes" class="nav-link" data-page="solicitudes">
                        <i class="bi bi-file-earmark-text"></i>Solicitudes
                    </a>
                    <a href="#pedidos" class="nav-link" data-page="pedidos">
                        <i class="bi bi-bag-check"></i>Pedidos de clientes
                        <span th:if="${pedidosPendientes > 0}" class="badge rounded-pill ms-auto"
                            style="background:var(--thread);color:var(--ink);font-size:var(--text-2xs);"
                            th:text="${pedidosPendientes}">0</span>
                    </a>
                    <a href="#ventas" class="nav-link" data-page="ventas">
                        <i class="bi bi-receipt"></i>Ventas
                    </a>
                    <a href="#reportes" class="nav-link" data-page="reportes">
                        <i class="bi bi-bar-chart-line"></i>Reporte de ventas
                    </a>

                    <hr class="stitch-divider my-3 mx-3" style="border-color:rgba(255,255,255,.18);">

                    <span class="stitch-tag px-3 pb-1 d-block" style="color:rgba(255,255,255,.55);">Catálogo</span>

                    <a href="#categorias" class="nav-link" data-page="categorias">
                        <i class="bi bi-tags"></i>Categorías
                    </a>
                    <a href="#proveedores" class="nav-link" data-page="proveedores">
                        <i class="bi bi-truck"></i>Proveedores
                    </a>

                    <hr class="stitch-divider my-3 mx-3" style="border-color:rgba(255,255,255,.18);">

                    <span class="stitch-tag px-3 pb-1 d-block" style="color:rgba(255,255,255,.55);">Seguridad</span>

                    <a href="#usuarios" class="nav-link" data-page="usuarios">
                        <i class="bi bi-people"></i>Usuarios
                        <span th:if="${usuariosPendientes > 0}" class="badge rounded-pill ms-auto"
                            style="background:var(--thread);color:var(--ink);font-size:var(--text-2xs);"
                            th:text="${usuariosPendientes}" title="Cuentas pendientes de activación">0</span>
                    </a>
                    <a href="#roles" class="nav-link" data-page="roles">
                        <i class="bi bi-shield-lock"></i>Roles
                    </a>
                </nav>

                <div class="sidebar-foot">
                    <div class="fw-semibold text-white" th:text="${usuarioActual.nombreCompleto}">Usuario</div>
                    <div th:text="${usuarioActual.etiqueta()}">Administrador</div>
                    <div class="text-dim" style="font-size:var(--text-2xs);" th:text="${usuarioActual.sucursalNombre}">
                    </div>
                    <a th:href="@{/logout}" class="text-dim d-inline-block mt-2 small">
                        <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión
                    </a>
                </div>
            </div>
        </div>

        <div class="main-area">
            <header class="topbar">
                <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-sm btn-outline-secondary d-lg-none" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#sidebarOffcanvas" aria-controls="sidebarOffcanvas">
                        <i class="bi bi-list"></i>
                    </button>
                    <!-- Opción de retorno: vuelve al módulo anterior (o al dashboard) -->
                    <button type="button" class="btn btn-sm btn-outline-secondary d-none" id="btnVolver"
                        title="Volver a la página anterior">
                        <i class="bi bi-arrow-left"></i><span class="d-none d-sm-inline ms-1">Volver</span>
                    </button>
                    <div>
                        <span class="topbar-eyebrow" id="topbarEyebrow">Panel general</span>
                        <h1 id="topbarTitle">Dashboard</h1>
                    </div>
                </div>
            </header>

            <!-- Contenedor de las páginas: todos los módulos están embebidos aquí -->
            <div class="page-body" id="pageOutlet">

                <section th:replace="~{fragments/modulos/dashboard :: dashboard}"></section>
                <section th:replace="~{fragments/modulos/productos :: productos}"></section>
                <section th:replace="~{fragments/modulos/movimientos :: movimientos}"></section>
                <section th:replace="~{fragments/modulos/sucursales :: sucursales}"></section>
                <section th:replace="~{fragments/modulos/solicitudes :: solicitudes}"></section>
                <section th:replace="~{fragments/modulos/pedidos :: pedidos}"></section>
                <section th:replace="~{fragments/modulos/ventas :: ventas}"></section>
                <section th:replace="~{fragments/modulos/reportes :: reportes}"></section>
                <section th:replace="~{fragments/modulos/categorias :: categorias}"></section>
                <section th:replace="~{fragments/modulos/proveedores :: proveedores}"></section>
                <section th:replace="~{fragments/modulos/usuarios :: usuarios}"></section>
                <section th:replace="~{fragments/modulos/roles :: roles}"></section>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

    <!-- Avisos del servidor: stock insuficiente, movimiento registrado, etc. -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:1080;">
        <div th:if="${mensaje}" id="tramaAviso" class="toast show trama-toast" role="alert" aria-live="assertive"
            aria-atomic="true"
            th:classappend="${tipoMensaje == 'success' ? 'toast-success' : (tipoMensaje == 'warning' ? 'toast-warning' : 'toast-danger')}">
            <div class="d-flex align-items-center">
                <div class="toast-body" th:text="${mensaje}">Listo</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Cerrar"></button>
            </div>
        </div>
    </div>

    <!-- Datos de los gráficos, calculados en AppController con ReporteService -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        window.TRAMA_CHARTS = {
            categoriasLabels: /*[[${categoriasLabels}]]*/ [],
            categoriasValores: /*[[${categoriasValores}]]*/ [],
            inventarioOk: /*[[${inventarioOk}]]*/ 0,
            inventarioBajo: /*[[${inventarioBajo}]]*/ 0,
            inventarioAgotado: /*[[${inventarioAgotado}]]*/ 0,
            diasLabels: /*[[${diasLabels}]]*/ [],
            entradaPorDia: /*[[${entradaPorDia}]]*/ [],
            salidaPorDia: /*[[${salidaPorDia}]]*/ [],
            rotacionLabels: /*[[${rotacionLabels}]]*/ [],
            rotacionValores: /*[[${rotacionValores}]]*/ [],
            reporteMesesLabels: /*[[${reporteMesesLabels}]]*/ [],
            reporteMesesTotales: /*[[${reporteMesesTotales}]]*/ [],
            reporteAnio: /*[[${anioSel}]]*/ 0
        };
        /*]]>*/
    </script>

    <script th:src="@{/assets/js/trama-dashboard.js}"></script>
    <script th:src="@{/assets/js/trama-movimientos.js}"></script>
    <script th:src="@{/assets/js/trama-app.js}"></script>
</body>

</html>
